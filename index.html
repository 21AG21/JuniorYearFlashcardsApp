<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<title>AP Decks</title>
<meta name="description" content="Flashcards for AP Lang, Chemistry, French, Calculus BC, and U.S. History.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AP Decks">
<meta name="theme-color" content="#f2f2f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png?v=2">
<link rel="icon" href="icon-192.png?v=2">
<link rel="stylesheet" href="liquid-glass.css">
<link rel="stylesheet" href="app.css">
</head>
<body>

<svg style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-decks" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><rect x="3.2" y="6.6" width="17.6" height="12.4" rx="2.6"/><path d="M6 4.2h12M7.4 2h9.2"/></g></symbol>
  <symbol id="i-review" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20.2 12a8.2 8.2 0 1 1-2.6-6"/><path d="M20.6 3.4v5.2h-5.2"/></g></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="10.8" cy="10.8" r="6.8"/><path d="M15.8 15.8 21 21"/></g></symbol>
  <symbol id="i-stats" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4.5 19.5V11M9.8 19.5V4.6M15.1 19.5v-6M20.4 19.5V8"/></g></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" d="M14.5 5 7.5 12l7 7"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M12 3.4l2.6 5.5 6 .8-4.4 4.2 1.1 6-5.3-3-5.3 3 1.1-6L3.4 9.7l6-.8z"/></symbol>
  <symbol id="i-star-fill" viewBox="0 0 24 24"><path fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M12 3.4l2.6 5.5 6 .8-4.4 4.2 1.1 6-5.3-3-5.3 3 1.1-6L3.4 9.7l6-.8z"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H9"/><path d="M7.5 5.5 4 9l3.5 3.5"/></g></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3.1"/><circle cx="12" cy="12" r="6.9"/><path d="M12 2.4v2.7M12 18.9v2.7M21.6 12h-2.7M5.1 12H2.4M18.8 5.2l-1.9 1.9M7.1 16.9l-1.9 1.9M18.8 18.8l-1.9-1.9M7.1 7.1 5.2 5.2"/></g></symbol>
</svg>

<main id="app" tabindex="-1"></main>

<nav class="tabs" id="tabs" hidden>
  <div class="lg lg-bar lg-tabbar" id="tabbar">
    <div class="lg-tab is-active" data-route="/" aria-label="Decks"><svg><use href="#i-decks"/></svg><span>Decks</span></div>
    <div class="lg-tab" data-route="/review" aria-label="Review"><svg><use href="#i-review"/></svg><span>Review</span></div>
    <div class="lg-tab" data-route="/search" aria-label="Search"><svg><use href="#i-search"/></svg><span>Search</span></div>
    <div class="lg-tab" data-route="/stats" aria-label="Progress"><svg><use href="#i-stats"/></svg><span>Progress</span></div>
    <div class="lg-tab" data-route="/settings" aria-label="Settings"><svg><use href="#i-gear"/></svg><span>Settings</span></div>
  </div>
</nav>

<div id="toast" role="status" aria-live="polite"></div>

<script src="liquid-glass.js"></script>
<script src="tex.js"></script>
<script src="store.js"></script>
<script src="games.js"></script>
<script src="app.js"></script>
</body>
</html>
